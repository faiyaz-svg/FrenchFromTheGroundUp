# The lesson map for the whole book, in reading order.
# tools/build_nav.py reads this file and updates the nav in mkdocs.yml,
# docs/progress.md, the home line map, docs/assets/lines.json and the lesson
# list in each stage's index.md.
# The start-here, practice and reference pages are listed in build_nav.py, not here.
#
# Every stage is a flat folder: docs/<folder>/<NN>-<slug>.md
# A lesson entry is [slug, title, flags]. flags holds exactly one area:
#   sounds, grammar, words, listen, speak, read, write, quebec
# and can also hold "review" (the last lesson of a stage).
# Each folder has a level: a1 (green line), a2 (orange), b1 (yellow), b2 (blue).

folders:
  # A1, green line
  - folder: 01-first-sounds-and-greetings
    level: a1
    title: "First sounds and greetings"
    tab: "1 Sounds"
    summary: "The sounds and spelling of French, typing accents, the first greetings, être, and your first conversation in Montreal."
    before: "Start here. Nothing else."
    lessons:
      - [french-sound-map, "How French spelling, sounds and rhythm work", [sounds]]
      - [typing-accents, "Typing accents on your keyboard", [write]]
      - [vowels-a-i-ou-u, "The vowels a, i, ou and u", [sounds]]
      - [vowels-e-family, "The e vowels", [sounds]]
      - [vowels-o-and-eu, "The vowels o and eu", [sounds]]
      - [nasal-vowels, "Nasal vowels", [sounds]]
      - [alphabet-and-spelling-names, "The alphabet and spelling your name", [words]]
      - [greetings-and-politeness, "Greetings and politeness", [speak]]
      - [bonjour-hi-montreal-greetings, "Bonjour-hi and other Montreal greetings", [quebec]]
