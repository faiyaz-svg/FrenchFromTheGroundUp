<text x="260.0" y="410.0" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">In each pair on the left side, the second vowel is said with rounded lips.</text>
<rect x="500" y="70" width="190" height="300" fill="none" stroke="#111111" stroke-width="2"/>
<rect x="500" y="70" width="190" height="10" fill="#1f9d55"/>
