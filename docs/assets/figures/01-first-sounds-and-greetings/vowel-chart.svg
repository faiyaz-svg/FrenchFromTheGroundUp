<text x="169.3" y="275.0" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#555555" text-anchor="end">half open</text>
<text x="216.0" y="375.0" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#555555" text-anchor="end">open</text>
