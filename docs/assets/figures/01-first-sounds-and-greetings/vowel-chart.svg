<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d">
<title id="t">French vowel chart</title>
<desc id="d">Oral vowels placed by tongue height and position, with example words, and the nasal vowels in a separate box.</desc>
<rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
