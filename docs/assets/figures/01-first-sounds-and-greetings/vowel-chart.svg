<text x="90.0" y="40.0" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#555555" text-anchor="start">front of the mouth</text>
<text x="430.0" y="40.0" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#555555" text-anchor="end">back</text>
