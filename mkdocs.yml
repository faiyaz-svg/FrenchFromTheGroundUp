site_name: French From the Ground Up
site_description: A self-study French textbook for learning French from zero to B2, for Montreal, Quebec and bilingual work in Canada. Speaking, listening and writing, with audio in your browser.
site_url: https://faiyaz-svg.github.io/FrenchFromTheGroundUp/
repo_url: https://github.com/faiyaz-svg/FrenchFromTheGroundUp
repo_name: faiyaz-svg/FrenchFromTheGroundUp
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# Listing any extension replaces Zensical's defaults, so every extension used is listed here.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: fr
          class: fr
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/theme.js
  - javascripts/lines.js
  - javascripts/speak.js
  - javascripts/translate.js
  - javascripts/sayit.js
  - javascripts/drills.js
  - javascripts/prevnext.js
  - javascripts/progress.js

extra_css:
  - https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap
  - stylesheets/site.css
  - stylesheets/tools.css

